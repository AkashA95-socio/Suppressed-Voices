# Controlled vocabularies for the four-model analysis. Used by both the
# Python analysis scripts and the agent prompts to ensure consistent
# tagging across runs.

# ============================================================
# Herman & Chomsky filters (structural)
# ============================================================
hc_filters:
  - ownership
  - advertising
  - sourcing
  - flak
  - fear_ideology

# Residual filters that apply to independent media specifically
residual_filters:
  - foundation_funding
  - subscriber_audience_bias
  - english_audience
  - urban_skew
  - delhi_mumbai_centrism
  - hindutva_secular_binary
  - ngo_sourcing
  - elite_informants
  - platform_virality
  - foreign_funding              # Al Jazeera
  - legal_harassment_chill       # post-Wire blocking, post-Zubair arrests

# ============================================================
# Ellul (civilisational)
# ============================================================
ellul_propaganda_type:
  - POLITICAL
  - SOCIOLOGICAL
  - MIXED

ellul_mode:
  - AGITATION
  - INTEGRATION
  - BOTH

ellul_direction:
  - VERTICAL
  - HORIZONTAL
  - BOTH

ellul_rationality:
  - RATIONAL
  - IRRATIONAL
  - MIXED

